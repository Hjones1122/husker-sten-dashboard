body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--dark);}
.header{background:var(--white);border-bottom:3px solid var(--red);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.header-left{display:flex;align-items:center;gap:14px;}
.header-logo{width:48px;height:48px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:900;font-style:italic;}
.header-title{font-size:18px;font-weight:700;letter-spacing:1px;}
.header-sub{font-size:12px;color:var(--mid);margin-top:2px;}
.header-meta{text-align:right;font-size:12px;color:var(--mid);line-height:1.7;}
.header-meta strong{color:var(--red);}
.date-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.date-bar label{font-size:12px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:1px;}
.date-bar select{padding:6px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:white;cursor:pointer;min-width:240px;}
.today-btn{padding:6px 14px;font-size:12px;font-weight:700;background:var(--red);color:white;border:none;border-radius:6px;cursor:pointer;}
.today-btn:hover{opacity:.85;}
.date-label{font-size:12px;color:var(--mid);font-style:italic;}
.nav-tabs{background:var(--white);border-bottom:1px solid var(--border);display:flex;padding:0 28px;overflow-x:auto;}
.nav-tab{padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--mid);transition:all .2s;white-space:nowrap;}
.nav-tab:hover{color:var(--red);}
.nav-tab.active{color:var(--red);border-bottom-color:var(--red);}
.main{padding:24px 28px;max-width:1400px;margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mid);margin:20px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.summary-card{background:white;border-radius:8px;padding:14px 16px;border-left:4px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.s-label{font-size:11px;color:var(--mid);text-transform:uppercase;letter-spacing:1px;}
.s-value{font-size:26px;font-weight:800;margin-top:2px;}
.s-sub{font-size:11px;color:var(--mid);margin-top:2px;}
.summary-card.red{border-left-color:var(--overload);}
.summary-card.orange{border-left-color:var(--outlier);}
.summary-card.yellow{border-left-color:var(--hlwatch);}
.summary-card.blue{border-left-color:var(--pattern);}
.summary-card.green{border-left-color:var(--clean);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
.athlete-card{background:white;border-radius:10px;border:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.05);overflow:hidden;transition:box-shadow .2s;cursor:pointer;}
.athlete-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);}
.athlete-card.flagged{border-left:4px solid var(--red);}
.athlete-card.watch{border-left:4px solid var(--hlwatch);}
.athlete-card.clean{border-left:4px solid var(--clean);}
.athlete-card.gk{border-left:4px solid #8E44AD;}
.athlete-card.injured{opacity:.55;border-left:4px solid #999;}
.card-header{padding:12px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;}
.card-name{font-size:15px;font-weight:700;}
.card-meta{font-size:11px;color:var(--mid);margin-top:2px;}
.composite-value{font-size:22px;font-weight:800;text-align:right;}
.composite-label{font-size:10px;color:var(--mid);text-transform:uppercase;text-align:right;}
.flag-strip{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:5px;}
.flag-badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:.5px;}
.clean-badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#E8F8F0;color:#27AE60;text-transform:uppercase;letter-spacing:.5px;}
.card-sparkline{padding:0 14px 6px;height:40px;}
.card-sparkline canvas{width:100%!important;height:40px!important;}
.card-note{padding:8px 14px 12px;font-size:11.5px;color:var(--mid);border-top:1px solid #F0F0F0;line-height:1.5;font-style:italic;}
.md-badge{display:inline-block;background:var(--dark);color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:6px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid);}
.legend-dot{width:12px;height:12px;border-radius:50%;}
.flagged-card{background:white;border-radius:10px;padding:20px 24px;margin-bottom:14px;border:1px solid var(--border);border-left:5px solid var(--red);}
.recent-sessions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.session-dot{text-align:center;min-width:52px;}
.sd-date{font-size:9px;color:var(--mid);}
.sd-md{font-size:9px;color:var(--mid);font-weight:600;}
.sd-comp{font-size:13px;font-weight:800;margin:2px 0;}
.sd-flags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;}
.mini-flag{width:8px;height:8px;border-radius:50%;display:inline-block;}
.athlete-select-bar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.athlete-select-bar select{padding:8px 14px;font-size:14px;border:1px solid var(--border);border-radius:6px;background:white;cursor:pointer;min-width:220px;}

.hero-name{font-size:22px;font-weight:800;}
.hero-meta{font-size:13px;color:var(--mid);margin-top:4px;}
.hero-stats{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;}
.hero-stat{text-align:center;}
.hs-val{font-size:20px;font-weight:700;}
.hs-lbl{font-size:10px;color:var(--mid);text-transform:uppercase;}
.chart-container{background:white;border-radius:10px;padding:20px 24px;margin-bottom:16px;border:1px solid var(--border);}
.chart-title{font-size:14px;font-weight:700;margin-bottom:14px;}
.chart-container canvas{max-height:260px;}
.session-table{width:100%;border-collapse:collapse;font-size:12px;}
.session-table th{background:#F8F8F8;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mid);border-bottom:2px solid var(--border);}
.session-table td{padding:7px 10px;border-bottom:1px solid #F0F0F0;}
.session-table tr:hover td{background:#FAFAFA;}
.sten-chip{display:inline-block;padding:2px 7px;border-radius:12px;font-weight:700;font-size:11px;color:white;}
.gk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

.gc-name{font-size:16px;font-weight:700;margin-bottom:12px;}
.gk-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gk-stat{text-align:center;background:#FAFAFA;border-radius:6px;padding:10px;}
.gs-val{font-size:20px;font-weight:800;}
.gs-lbl{font-size:10px;color:var(--mid);text-transform:uppercase;}
.rehab-card{background:#FAFAFA;border-radius:10px;padding:18px 20px;border:1px solid var(--border);opacity:.75;margin-bottom:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.rehab-badge{background:#999;color:white;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.gk-summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:8px;}

.gk-sum-name{font-size:16px;font-weight:800;margin-bottom:2px;}
.gk-sum-meta{font-size:11px;color:var(--mid);margin-bottom:12px;}
.gk-sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gk-sum-stat{text-align:center;background:#FAFAFA;border-radius:6px;padding:8px 4px;}
.gss-val{font-size:18px;font-weight:800;}
.gss-lbl{font-size:9px;color:var(--mid);text-transform:uppercase;letter-spacing:.5px;}
.no-flags-msg{text-align:center;padding:48px;color:var(--mid);font-size:14px;background:white;border-radius:10px;border:1px solid var(--border);}
.nf-icon{font-size:32px;margin-bottom:8px;}
.past-banner{background:#FFF8E1;border:1px solid #F5A623;border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:#7D5C00;display:flex;align-items:center;gap:8px;}
</style>
</head>

const ALL_DATES     = ["2026-07-15", "2026-07-16", "2026-07-18", "2026-07-21", "2026-07-22"];
const LATEST_DATE   = "2026-07-22";
let SELECTED_DATE   = LATEST_DATE;
let activeCharts    = [];
let currentTab      = 'team';
let selAthlete      = '';

function populateDateSelect(){
  const sel = document.getElementById('globalDateSelect');
  sel.innerHTML='';
  [...ALL_DATES].reverse().forEach(d=>{
    const o=document.createElement('option');
    o.value=d;
    o.textContent=fmtDate(d);
    if(d===SELECTED_DATE) o.selected=true;
    sel.appendChild(o);
  });
  updateDateLabel();
}
function fmtDate(d){
  const x=new Date(d+'T12:00:00');
  return x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function onDateChange(){
  SELECTED_DATE=document.getElementById('globalDateSelect').value;
  updateDateLabel(); destroyCharts(); renderActiveTab();
}
function jumpToLatest(){
  SELECTED_DATE=LATEST_DATE;
  document.getElementById('globalDateSelect').value=LATEST_DATE;
  updateDateLabel(); destroyCharts(); renderActiveTab();
}
function updateDateLabel(){
  let md='';
  for(const a of ALL_ATHLETES){
    const s=a.sessions.find(x=>x.date===SELECTED_DATE);
    if(s&&s.mdLabel){md=s.mdLabel;break;}
  }
  document.getElementById('dateMDLabel').textContent=
    md?'· '+md:(SELECTED_DATE!==LATEST_DATE?'· Historical view':'· Most recent');
}
function snap(a,asOf){
  const sessions=a.sessions.filter(s=>s.date<=asOf);
  if(!sessions.length) return null;
  const latest=sessions[sessions.length-1];
  const daysDiff=(new Date(asOf+'T12:00:00')-new Date(latest.date+'T12:00:00'))/86400000;
  if(daysDiff>14) return null;
  return{...a,
    latestFlags:       latest.flags,
    latestLoad:        latest.LoadSignal,
    latestIntensity:   latest.IntensitySignal,
    latestDate:        latest.dateLabel,
    latestSession:     latest,
    note:              latest.note||a.note,
    sparkline:         sessions.slice(-10).map(s=>s.LoadSignal),
    worstPriority:     latest.flags.length?Math.min(...latest.flags.map(f=>f.priority)):99,
    sessions};
}
function showTab(name,event){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(event&&event.target) event.target.classList.add('active');
  currentTab=name; destroyCharts(); renderActiveTab();
}
function renderActiveTab(){
  if(currentTab==='team')       renderTeam();
  if(currentTab==='flagged')    renderFlagged();
  if(currentTab==='individual') renderIndividual();
  if(currentTab==='gk')         renderGK();
  if(currentTab==='rehab')      renderRehab();
}
function destroyCharts(){activeCharts.forEach(c=>{try{c.destroy();}catch(e){}}); activeCharts=[];}
function fb(f){return `<span class="flag-badge" style="background:${f.color}">${f.label}</span>`;}
function stenColor(v){
  if(!v||isNaN(v)) return'#999';
  if(v>=8) return'#E41C38'; if(v>=6.5) return'#F5A623';
  if(v>=4) return'#27AE60'; if(v>=2.5) return'#5B7FD4'; return'#9B59B6';
}
function mgl(mg){return{'H':'HMP','M':'MMP','L':'LMP','GK':'GK','I':'Injured'}[mg]||mg;}
function cc(s){
  if(!s) return'clean';
  if(s.minGroup==='I') return'injured';
  if(s.minGroup==='GK') return'gk';
  if(!s.latestFlags||!s.latestFlags.length) return'clean';
  return Math.min(...s.latestFlags.map(f=>f.priority))<=2?'flagged':'watch';
}
function pastBanner(){
  if(SELECTED_DATE===LATEST_DATE) return'';
  return`<div class="past-banner">⏪ Historical view: <strong>${fmtDate(SELECTED_DATE)}</strong>. Only athletes with a session within 14 days shown.
    <button onclick="jumpToLatest()" style="margin-left:auto;background:var(--red);color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px">Back to Latest</button></div>`;
}
function segmentColor(ctx){
  // Color each line segment by the value at that point
  const v=ctx.p1.parsed.y;
  if(v>=7.5) return '#E41C38';  // red — high load
  if(v<=3.5) return '#27AE60';  // green — low load
  return '#AAAAAA';              // gray — normal
}
function sparkline(canvas,data){
  if(!data||!data.length) return null;
  return new Chart(canvas,{type:'line',
    data:{
      labels:data.map((_,i)=>i),
      datasets:[{
        data,
        borderColor:'#AAAAAA',
        borderWidth:2.5,
        pointRadius:0,
        fill:false,
        tension:0.3,
        segment:{borderColor:ctx=>segmentColor(ctx)},
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false,min:1,max:10}},
      animation:false,
    }});
}

// ── TEAM ────────────────────────────────────────────────────────────────────
function renderTeam(){
  const snaps=ALL_ATHLETES.filter(a=>a.minGroup!=='GK'&&a.minGroup!=='I')
    .map(a=>snap(a,SELECTED_DATE)).filter(Boolean);
  const flagged=snaps.filter(s=>s.latestFlags&&s.latestFlags.length);
  const clean=snaps.filter(s=>!s.latestFlags||!s.latestFlags.length);
  const ovr =snaps.filter(s=>s.latestFlags.some(f=>f.code==='OVR'));
  const isp =snaps.filter(s=>s.latestFlags.some(f=>f.code==='ISP'));
  const hlw =snaps.filter(s=>s.latestFlags.some(f=>f.code==='HLW'));
  const und =snaps.filter(s=>s.latestFlags.some(f=>f.code==='UND'));
  const mon =snaps.filter(s=>s.latestFlags.some(f=>f.code==='MON'));
  const pat =snaps.filter(s=>s.latestFlags.some(f=>f.code==='PAT'));

  let h=pastBanner();
  h+=`<div class="summary-bar">
    <div class="summary-card red"><div class="s-label">Overload</div><div class="s-value" style="color:#E41C38">${ovr.length}</div><div class="s-sub">Load + Intensity</div></div>
    <div class="summary-card orange"><div class="s-label">Int. Spike</div><div class="s-value" style="color:#FF6B35">${isp.length}</div><div class="s-sub">Intensity only</div></div>
    <div class="summary-card yellow"><div class="s-label">High Load</div><div class="s-value" style="color:#F5A623">${hlw.length}</div><div class="s-sub">2 consec. days</div></div>
    <div class="summary-card blue"><div class="s-label">Underload</div><div class="s-value" style="color:#5B7FD4">${und.length}</div><div class="s-sub">7d avg low</div></div>
    <div class="summary-card" style="border-left-color:#8E44AD"><div class="s-label">Monotony</div><div class="s-value" style="color:#8E44AD">${mon.length}</div><div class="s-sub">Low variation</div></div>
    <div class="summary-card green"><div class="s-label">Clean</div><div class="s-value" style="color:var(--clean)">${clean.length}</div><div class="s-sub">athletes</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#E41C38"></div>Overload — Load + Intensity</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF6B35"></div>Intensity Spike — acute risk</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F5A623"></div>High Load Watch — 2 consecutive high days</div>
    <div class="legend-item"><div class="legend-dot" style="background:#5B7FD4"></div>Underload — 7d avg below threshold</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8E44AD"></div>Monotony — insufficient day-to-day variation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2C3E50"></div>Pattern Risk — 3+ flags in 14 days</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--clean)"></div>Clean</div>
    <div class="legend-item" style="gap:4px"><div style="width:20px;height:3px;background:#E41C38;border-radius:2px"></div>Sparkline High ≥7.5</div>
    <div class="legend-item" style="gap:4px"><div style="width:20px;height:3px;background:#27AE60;border-radius:2px"></div>Sparkline Low ≤3.5</div>
    <div class="legend-item" style="gap:4px"><div style="width:20px;height:3px;background:#AAA;border-radius:2px"></div>Sparkline Normal</div>
  </div>`;

  if(flagged.length){
    const sorted=[...flagged].sort((a,b)=>a.worstPriority-b.worstPriority);
    h+=`<div class="section-title">Flagged Athletes (${flagged.length})</div>
        <div class="cards-grid">${sorted.map(s=>card(s)).join('')}</div>`;
  }else{
    h+=`<div class="section-title">Flagged Athletes</div>
        <div class="no-flags-msg"><div class="nf-icon">✅</div>No athletes flagged.</div>`;
  }
  const cs=[...clean].sort((a,b)=>a.name.localeCompare(b.name));
  h+=`<div class="section-title">All Clear (${clean.length})</div>
      <div class="cards-grid">${cs.map(s=>card(s)).join('')}</div>`;

  document.getElementById('tab-team').innerHTML=h;
  setTimeout(()=>{
    ALL_ATHLETES.forEach(a=>{
      const s=snap(a,SELECTED_DATE); if(!s) return;
      const el=document.getElementById('sp-'+a.name.replace(/\s/g,'_'));
      if(el){const ch=sparkline(el,s.sparkline); if(ch) activeCharts.push(ch);}
    });
  },80);
}

function loadColor(v){
  if(!v||isNaN(v)) return'#999';
  if(v>=7.5) return'#E41C38';
  if(v>=6.5) return'#F5A623';
  if(v<=3.5) return'#27AE60';
  return'var(--dark)';
}
function intensityColor(v){
  if(v>=25)  return'#E41C38';
  if(v>=10)  return'#F5A623';
  if(v<=-20) return'#5B7FD4';
  return'var(--dark)';
}
function card(s){
  const md=s.latestSession?s.latestSession.mdLabel:'';
  const fs=s.latestFlags&&s.latestFlags.length?s.latestFlags.map(f=>fb(f)).join(''):'<span class="clean-badge">✓ Clean</span>';
  const load=s.latestLoad||0;
  const inten=s.latestIntensity||0;
  const intenStr=inten>0?`+${inten.toFixed(0)}%`:inten===0?'—':`${inten.toFixed(0)}%`;
  return`<div class="athlete-card ${cc(s)}" onclick="openInd('${s.name}')">
    <div class="card-header">
      <div><div class="card-name">#${s.jersey} ${s.name}${md?`<span class="md-badge">${md}</span>`:''}</div>
        <div class="card-meta">${s.position} · ${mgl(s.minGroup)} · ${s.latestDate}</div></div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:800;color:${loadColor(load)}">${load.toFixed(1)}</div>
          <div style="font-size:9px;color:var(--mid);text-transform:uppercase;letter-spacing:.5px">Load</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:22px;font-weight:800;color:${intensityColor(inten)}">${intenStr}</div>
          <div style="font-size:9px;color:var(--mid);text-transform:uppercase;letter-spacing:.5px">Intensity</div>
        </div>
      </div>
    </div>
    <div class="flag-strip">${fs}</div>
    <div class="card-sparkline"><canvas id="sp-${s.name.replace(/\s/g,'_')}"></canvas></div>
    ${s.note?`<div class="card-note">${s.note}</div>`:''}
  </div>`;
}

// ── FLAGGED ─────────────────────────────────────────────────────────────────
function renderFlagged(){
  const flagged=ALL_ATHLETES.filter(a=>a.minGroup!=='I')
    .map(a=>snap(a,SELECTED_DATE))
    .filter(s=>s&&s.latestFlags&&s.latestFlags.length)
    .sort((a,b)=>a.worstPriority-b.worstPriority);

  let h=pastBanner();
  if(!flagged.length){h+=`<div class="no-flags-msg"><div class="nf-icon">✅</div>No athletes flagged on this date.</div>`;document.getElementById('tab-flagged').innerHTML=h;return;}

  h+=flagged.map(s=>{
    const last5=s.sessions.slice(-5);
    const dots=last5.map(x=>{
      const dc=x.flags&&x.flags.length?x.flags[0].color:'#27AE60';
      const mf=(x.flags||[]).map(f=>`<div class="mini-flag" style="background:${f.color}"></div>`).join('');
      return`<div class="session-dot"><div class="sd-date">${x.dateLabel}</div><div class="sd-md">${x.mdLabel||x.sessionType}</div>
        <div class="sd-comp" style="color:${dc}">${x.LoadSignal.toFixed(1)}</div>
        <div class="sd-flags">${mf||'<div class="mini-flag" style="background:#27AE60"></div>'}</div></div>`;
    }).join('');
    const bc=s.latestFlags[0]?s.latestFlags[0].color:'#E41C38';
    const intenStr=s.latestIntensity>0?`+${s.latestIntensity.toFixed(0)}%`:s.latestIntensity===0?'—':`${s.latestIntensity.toFixed(0)}%`;
    return`<div class="flagged-card" style="border-left-color:${bc}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div><div style="font-size:17px;font-weight:800">#${s.jersey} ${s.name}</div>
          <div style="font-size:12px;color:var(--mid)">${s.position} · ${mgl(s.minGroup)}</div>
          <div style="margin-top:8px">${s.latestFlags.map(f=>fb(f)).join(' ')}</div></div>
        <div style="display:flex;gap:16px;text-align:center">
          <div><div style="font-size:26px;font-weight:800;color:${loadColor(s.latestLoad)}">${(s.latestLoad||0).toFixed(1)}</div><div style="font-size:11px;color:var(--mid)">Load Signal</div></div>
          <div><div style="font-size:26px;font-weight:800;color:${intensityColor(s.latestIntensity)}">${intenStr}</div><div style="font-size:11px;color:var(--mid)">Intensity</div></div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--mid);margin-bottom:6px;font-weight:600">Last 5 Sessions</div>
      <div class="recent-sessions">${dots}</div>
      ${s.note?`<div style="font-size:13px;color:var(--mid);font-style:italic;background:#FAFAFA;padding:10px 14px;border-radius:6px;margin-top:10px;line-height:1.6;border-left:3px solid var(--border)">${s.note}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('tab-flagged').innerHTML=h;
}

// ── INDIVIDUAL ──────────────────────────────────────────────────────────────
function openInd(name){
  selAthlete=name;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.textContent.trim()==='Individual'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-individual').classList.add('active');
  currentTab='individual'; destroyCharts(); renderIndividual();
}

function renderIndividual(){
  const cont=document.getElementById('tab-individual');
  if(!document.getElementById('indSel')){
    cont.innerHTML=`<div class="athlete-select-bar">
      <select id="indSel" onchange="selAthlete=this.value;destroyCharts();renderIndividual()">
        <option value="">— Select Athlete —</option>
      </select></div><div id="indCont"></div>`;
    const sel=document.getElementById('indSel');
    [...ALL_ATHLETES].sort((a,b)=>a.jersey-b.jersey).forEach(a=>{
      const o=document.createElement('option');
      o.value=a.name; o.textContent=`#${a.jersey} ${a.name} (${a.position})`;
      sel.appendChild(o);
    });
  }
  if(selAthlete) document.getElementById('indSel').value=selAthlete;
  const name=selAthlete||(document.getElementById('indSel')?document.getElementById('indSel').value:'');
  if(!name){document.getElementById('indCont').innerHTML='';return;}

  const a=ALL_ATHLETES.find(x=>x.name===name);
  if(!a) return;
  const sessions=a.sessions.filter(s=>s.date<=SELECTED_DATE);
  if(!sessions.length){
    document.getElementById('indCont').innerHTML=`<div class="no-flags-msg"><div class="nf-icon">📭</div>No sessions for ${name} on or before ${fmtDate(SELECTED_DATE)}.</div>`;
    return;
  }

  const latest=sessions[sessions.length-1];
  const last28=sessions.slice(-28);
  const avgPL=(sessions.reduce((s,x)=>s+x.PL,0)/sessions.length).toFixed(1);
  const vd=new Date(SELECTED_DATE+'T12:00:00');
  const f14=sessions.filter(s=>{const d=new Date(s.date+'T12:00:00');return(vd-d)/86400000<=14&&s.flags&&s.flags.length;}).length;
  const fs=latest.flags&&latest.flags.length?latest.flags.map(f=>fb(f)).join(' '):'<span class="clean-badge">✓ Clean</span>';

  const labels    = last28.map(s=>s.mdLabel||s.dateLabel);
  const loadData  = last28.map(s=>s.LoadSignal);
  const intenData = last28.map(s=>s.IntensitySignal);
  const plData    = last28.map(s=>s.STEN_PL);
  const eeData    = last28.map(s=>s.STEN_EE);
  const hsrData   = last28.map(s=>s.STEN_HSR);
  const ptColors  = last28.map(s=>s.flags&&s.flags.length?s.flags[0].color:'#27AE60');

  const intenStr=v=>v>0?`+${v.toFixed(0)}%`:v===0?'0%':`${v.toFixed(0)}%`;

  const rows=sessions.slice(-14).reverse().map(s=>{
    const fb2=(s.flags||[]).map(f=>`<span class="flag-badge" style="background:${f.color};font-size:9px">${f.code}</span>`).join(' ');
    const chip=v=>`<span class="sten-chip" style="background:${stenColor(v)}">${v.toFixed(1)}</span>`;
    const iColor=intensityColor(s.IntensitySignal);
    return`<tr>
      <td>${s.dateLabel}</td>
      <td>${s.mdLabel||s.sessionType}</td>
      <td>${s.indoor?'Indoor':'Outdoor'}</td>
      <td><strong>${s.PL.toFixed(1)}</strong></td>
      <td>${s.PLpm.toFixed(2)}</td>
      <td>${chip(s.STEN_PL)}</td>
      <td>${s.indoor?'—':s.HSR.toFixed(1)}</td>
      <td>${chip(s.STEN_HSR)}</td>
      <td>${s.EE}</td>
      <td>${chip(s.STEN_EE)}</td>
      <td><strong style="color:${loadColor(s.LoadSignal)}">${s.LoadSignal.toFixed(2)}</strong></td>
      <td><strong style="color:${iColor}">${intenStr(s.IntensitySignal)}</strong></td>
      <td>${fb2||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('indCont').innerHTML=`
    ${SELECTED_DATE!==LATEST_DATE?pastBanner():''}
    <div class="athlete-hero">
      <div style="flex:1;min-width:200px">
        <div class="hero-name">#${a.jersey} ${a.name}</div>
        <div class="hero-meta">${a.position} · ${mgl(a.minGroup)} · ${sessions.length} sessions tracked</div>
        <div style="margin-top:10px">${fs}</div>
        ${latest.note?`<div style="margin-top:10px;font-size:12px;color:var(--mid);font-style:italic">${latest.note}</div>`:''}
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hs-val" style="color:${loadColor(latest.LoadSignal)}">${latest.LoadSignal.toFixed(1)}</div><div class="hs-lbl">Load Signal</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:${intensityColor(latest.IntensitySignal)}">${intenStr(latest.IntensitySignal)}</div><div class="hs-lbl">Intensity</div></div>
        <div class="hero-stat"><div class="hs-val">${latest.STEN_PL.toFixed(1)}</div><div class="hs-lbl">STEN PL</div></div>
        <div class="hero-stat"><div class="hs-val">${avgPL}</div><div class="hs-lbl">Avg PL</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:${f14>2?'var(--red)':'var(--dark)'}">${f14}</div><div class="hs-lbl">Flags/14d</div></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="chart-container">
        <div class="chart-title">Load Signal — Last 28 Sessions (1–10 scale)</div>
        <canvas id="loadChart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">Intensity Signal — % above/below 7d baseline</div>
        <canvas id="intenChart"></canvas>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-title">STEN Component Scores — PL / HSR / EE</div>
      <canvas id="stenChart"></canvas>
    </div>

    <div class="chart-container">
      <div style="overflow-x:auto">
        <table class="session-table">
          <thead><tr>
            <th>Date</th><th>MD</th><th>Env</th>
            <th>PL</th><th>PL/min</th><th>STEN PL</th>
            <th>HSR</th><th>STEN HSR</th>
            <th>EE</th><th>STEN EE</th>
            <th>Load Signal</th><th>Intensity</th><th>Flags</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;

  setTimeout(()=>{
    // Load Signal chart with colored points
    const c1=new Chart(document.getElementById('loadChart'),{
      type:'line',
      data:{labels,datasets:[{
        label:'Load Signal',data:loadData,
        borderColor:'#AAAAAA',borderWidth:2.5,
        pointBackgroundColor:loadData.map(v=>loadColor(v)),
        pointRadius:5,pointHoverRadius:7,
        fill:true,backgroundColor:'rgba(180,180,180,.08)',tension:0.3,
        segment:{borderColor:ctx=>{
          const v=ctx.p1.parsed.y;
          if(v>=7.5) return'#E41C38';
          if(v<=3.5) return'#27AE60';
          return'#AAAAAA';
        }}
      }]},
      options:{responsive:true,
        plugins:{legend:{display:false},
          annotation:{annotations:{
            high:{type:'line',yMin:7.5,yMax:7.5,borderColor:'rgba(228,28,56,.3)',borderWidth:1,borderDash:[4,4]},
            low:{type:'line',yMin:3.5,yMax:3.5,borderColor:'rgba(39,174,96,.3)',borderWidth:1,borderDash:[4,4]}
          }}
        },
        scales:{y:{min:1,max:10,grid:{color:'#F0F0F0'},ticks:{stepSize:1}},x:{ticks:{font:{size:10},maxRotation:45}}}
      }
    });

    // Intensity Signal — bar chart, colored by value
    const intenColors=intenData.map(v=>v>=25?'rgba(228,28,56,.7)':v>=10?'rgba(245,166,35,.7)':v<=-20?'rgba(91,127,212,.7)':'rgba(39,174,96,.5)');
    const c2=new Chart(document.getElementById('intenChart'),{
      type:'bar',
      data:{labels,datasets:[{
        label:'Intensity Signal (%)',data:intenData,
        backgroundColor:intenColors,borderColor:intenColors.map(c=>c.replace('.7','1').replace('.5','1')),
        borderWidth:1,
      }]},
      options:{responsive:true,
        plugins:{legend:{display:false},
          tooltip:{callbacks:{label:ctx=>`Intensity: ${ctx.raw>0?'+':''}${ctx.raw.toFixed(0)}%`}}
        },
        scales:{
          y:{grid:{color:'#F0F0F0'},ticks:{callback:v=>`${v>0?'+':''}${v}%`}},
          x:{ticks:{font:{size:10},maxRotation:45}}
        }
      }
    });

    // STEN components
    const c3=new Chart(document.getElementById('stenChart'),{
      type:'line',
      data:{labels,datasets:[
        {label:'STEN PL', data:plData, borderColor:'#E41C38',borderWidth:2,pointRadius:3,tension:0.3,fill:false},
        {label:'STEN HSR',data:hsrData,borderColor:'#27AE60',borderWidth:2,pointRadius:3,tension:0.3,fill:false},
        {label:'STEN EE', data:eeData, borderColor:'#F5A623',borderWidth:2,pointRadius:3,tension:0.3,fill:false},
      ]},
      options:{responsive:true,plugins:{legend:{position:'top'}},
        scales:{y:{min:1,max:10,grid:{color:'#F0F0F0'},ticks:{stepSize:1}},x:{ticks:{font:{size:10},maxRotation:45}}}
      }
    });
    activeCharts.push(c1,c2,c3);
  },50);
}

// ── GK ──────────────────────────────────────────────────────────────────────
function getWeekKey(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const day=d.getDay(); // 0=Sun,1=Mon...
  const diff=d.getDate()-(day===0?6:day-1); // Mon start
  const mon=new Date(d.setDate(diff));
  return mon.toISOString().slice(0,10);
}
function weekLabel(wk){
  const d=new Date(wk+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function renderGK(){
  const gks=ALL_ATHLETES.filter(a=>a.minGroup==='GK');
  let h=pastBanner();
  if(!gks.length){document.getElementById('tab-gk').innerHTML=h+'<p>No goalkeepers in roster.</p>';return;}

  // ── TOP: summary cards for all GKs ─────────────────────────────────────
  h+=`<div class="section-title">Goalkeeper Summary</div>
  <div class="gk-summary-grid">`;
  gks.forEach(a=>{
    const ss=a.sessions.filter(s=>s.date<=SELECTED_DATE);
    const lat=ss.length?ss[ss.length-1]:null;
    const avgPL=ss.length?(ss.reduce((t,x)=>t+x.PL,0)/ss.length).toFixed(1):'—';
    const avgDives=ss.length?(ss.reduce((t,x)=>t+x.DiveCount,0)/ss.length).toFixed(1):'—';
    const seasonDives=ss.reduce((t,x)=>t+x.DiveCount,0);
    const seasonHL=ss.reduce((t,x)=>t+x.DiveHighLoad,0);
    h+=`<div class="gk-sum-card">
      <div class="gk-sum-name">#${a.jersey} ${a.name}</div>
      <div class="gk-sum-meta">${lat?lat.dateLabel+' · '+(lat.mdLabel||lat.sessionType):'No sessions'}</div>
      <div class="gk-sum-stats">
        <div class="gk-sum-stat"><div class="gss-val">${lat?lat.PL.toFixed(1):'—'}</div><div class="gss-lbl">PL</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${lat?lat.DiveCount:'—'}</div><div class="gss-lbl">Dives</div></div>
        <div class="gk-sum-stat"><div class="gss-val" style="color:#E41C38">${lat?lat.DiveHighLoad:'—'}</div><div class="gss-lbl">High Load</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${lat?lat.DiveLoad.toFixed(0):'—'}</div><div class="gss-lbl">Dive Load</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${lat?lat.EE:'—'}</div><div class="gss-lbl">Exp Efforts</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${avgPL}</div><div class="gss-lbl">Avg PL</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${avgDives}</div><div class="gss-lbl">Avg Dives</div></div>
        <div class="gk-sum-stat"><div class="gss-val">${seasonDives}</div><div class="gss-lbl">Season Dives</div></div>
        <div class="gk-sum-stat"><div class="gss-val" style="color:#E41C38">${seasonHL}</div><div class="gss-lbl">Season HL</div></div>
      </div>
      <div class="gk-dir-bar">
        ${buildDirBar(ss)}
      </div>
    </div>`;
  });
  h+=`</div>`;

  // ── MIDDLE: team weekly dispersion chart ────────────────────────────────
  // Build weekly totals for all GKs combined
  const allGKSess=gks.flatMap(a=>a.sessions.filter(s=>s.date<=SELECTED_DATE));
  const weekMap={};
  allGKSess.forEach(s=>{
    const wk=getWeekKey(s.date);
    if(!weekMap[wk]) weekMap[wk]={L:0,R:0,C:0,total:0,hl:0,load:0};
    weekMap[wk].L+=s.DiveLeft; weekMap[wk].R+=s.DiveRight;
    weekMap[wk].C+=s.DiveCentre; weekMap[wk].total+=s.DiveCount;
    weekMap[wk].hl+=s.DiveHighLoad; weekMap[wk].load+=s.DiveLoad;
  });
  const weeks=Object.keys(weekMap).sort().slice(-12); // last 12 weeks
  const wLabels=weeks.map(w=>weekLabel(w));
  const wL=weeks.map(w=>weekMap[w].L);
  const wR=weeks.map(w=>weekMap[w].R);
  const wC=weeks.map(w=>weekMap[w].C);
  const wHL=weeks.map(w=>weekMap[w].hl);

  h+=`<div class="section-title" style="margin-top:28px">Team Dive Dispersion — Weekly (All GKs)</div>
  <div class="chart-container">
    <div class="chart-title">Dive Direction + High Load Dives by Week</div>
    <canvas id="gkDispChart"></canvas>
  </div>`;

  // ── INDIVIDUAL: dropdown + full breakdown ───────────────────────────────
  h+=`<div class="section-title" style="margin-top:28px">Individual Goalkeeper Analysis</div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <select id="gkSelect" onchange="renderGKIndividual()" style="padding:8px 14px;font-size:14px;border:1px solid var(--border);border-radius:6px;background:white;cursor:pointer;min-width:220px">
      <option value="">— Select Goalkeeper —</option>
      ${gks.map(a=>`<option value="${a.name}">#${a.jersey} ${a.name}</option>`).join('')}
    </select>
  </div>
  <div id="gkIndContent"></div>`;

  document.getElementById('tab-gk').innerHTML=h;

  // Draw team dispersion chart
  setTimeout(()=>{
    const ctx=document.getElementById('gkDispChart');
    if(ctx){
      const ch=new Chart(ctx,{
        type:'bar',
        data:{
          labels:wLabels,
          datasets:[
            {label:'Left',  data:wL, backgroundColor:'#5B7FD4',stack:'dir'},
            {label:'Centre',data:wC, backgroundColor:'#27AE60',stack:'dir'},
            {label:'Right', data:wR, backgroundColor:'#F5A623',stack:'dir'},
            {label:'High Load',data:wHL,backgroundColor:'#E41C38',type:'line',
              borderColor:'#E41C38',borderWidth:2.5,pointRadius:4,fill:false,
              yAxisID:'y2',stack:undefined},
          ]
        },
        options:{
          responsive:true,
          plugins:{
            legend:{position:'top'},
            tooltip:{mode:'index',intersect:false}
          },
          scales:{
            x:{stacked:true,ticks:{font:{size:11}}},
            y:{stacked:true,title:{display:true,text:'Dive Count'},grid:{color:'#F0F0F0'}},
            y2:{position:'right',title:{display:true,text:'High Load Dives'},grid:{display:false},min:0}
          }
        }
      });
      activeCharts.push(ch);
    }
  },80);
}

function buildDirBar(sessions){
  const L=sessions.reduce((t,s)=>t+s.DiveLeft,0);
  const R=sessions.reduce((t,s)=>t+s.DiveRight,0);
  const C=sessions.reduce((t,s)=>t+s.DiveCentre,0);
  const total=L+R+C||1;
  const pL=((L/total)*100).toFixed(0);
  const pR=((R/total)*100).toFixed(0);
  const pC=((C/total)*100).toFixed(0);
  return`<div style="margin-top:10px">
    <div style="font-size:10px;color:var(--mid);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Season Direction Split</div>
    <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px">
      <div style="width:${pL}%;background:#5B7FD4" title="Left ${pL}%"></div>
      <div style="width:${pC}%;background:#27AE60" title="Centre ${pC}%"></div>
      <div style="width:${pR}%;background:#F5A623" title="Right ${pR}%"></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:4px;font-size:10px;color:var(--mid)">
      <span>⬤ Left ${pL}%</span><span style="color:#27AE60">⬤ Centre ${pC}%</span><span style="color:#F5A623">⬤ Right ${pR}%</span>
    </div>
  </div>`;
}

function renderGKIndividual(){
  const name=document.getElementById('gkSelect').value;
  const cont=document.getElementById('gkIndContent');
  if(!name){cont.innerHTML='';return;}

  const a=ALL_ATHLETES.find(x=>x.name===name);
  if(!a) return;
  const sessions=a.sessions.filter(s=>s.date<=SELECTED_DATE);
  if(!sessions.length){
    cont.innerHTML=`<div class="no-flags-msg"><div class="nf-icon">📭</div>No sessions for ${name} on or before ${fmtDate(SELECTED_DATE)}.</div>`;
    return;
  }

  // Weekly aggregation for this GK
  const weekMap={};
  sessions.forEach(s=>{
    const wk=getWeekKey(s.date);
    if(!weekMap[wk]) weekMap[wk]={L:0,R:0,C:0,total:0,hl:0,load:0,pl:0,ee:0,n:0};
    weekMap[wk].L+=s.DiveLeft; weekMap[wk].R+=s.DiveRight;
    weekMap[wk].C+=s.DiveCentre; weekMap[wk].total+=s.DiveCount;
    weekMap[wk].hl+=s.DiveHighLoad; weekMap[wk].load+=s.DiveLoad;
    weekMap[wk].pl+=s.PL; weekMap[wk].ee+=s.EE; weekMap[wk].n++;
  });
  const weeks=Object.keys(weekMap).sort().slice(-12);
  const wLabels=weeks.map(w=>weekLabel(w));

  // Session-by-session data
  const last20=sessions.slice(-20);
  const sLabels=last20.map(s=>s.mdLabel||s.dateLabel);
  const sDives=last20.map(s=>s.DiveCount);
  const sHL=last20.map(s=>s.DiveHighLoad);
  const sDiveLoad=last20.map(s=>s.DiveLoad);
  const sPL=last20.map(s=>s.PL);

  // Season totals for donut
  const totL=sessions.reduce((t,s)=>t+s.DiveLeft,0);
  const totR=sessions.reduce((t,s)=>t+s.DiveRight,0);
  const totC=sessions.reduce((t,s)=>t+s.DiveCentre,0);

  // Hero stats
  const lat=sessions[sessions.length-1];
  const avgDives=(sessions.reduce((t,s)=>t+s.DiveCount,0)/sessions.length).toFixed(1);
  const seasonHL=sessions.reduce((t,s)=>t+s.DiveHighLoad,0);
  const hlRatio=sessions.reduce((t,s)=>t+s.DiveCount,0)>0
    ?((seasonHL/sessions.reduce((t,s)=>t+s.DiveCount,0))*100).toFixed(0)+'%':'—';

  // Session table
  const rows=sessions.slice(-14).reverse().map(s=>{
    const hlPct=s.DiveCount>0?((s.DiveHighLoad/s.DiveCount)*100).toFixed(0):0;
    return`<tr>
      <td>${s.dateLabel}</td><td>${s.mdLabel||s.sessionType}</td>
      <td>${s.indoor?'🏠':'🌿'}</td>
      <td><strong>${s.PL.toFixed(1)}</strong></td>
      <td>${s.DiveCount}</td>
      <td style="color:#E41C38;font-weight:700">${s.DiveHighLoad}</td>
      <td>${s.DiveLoad.toFixed(0)}</td>
      <td>${s.DiveLeft}</td><td>${s.DiveCentre}</td><td>${s.DiveRight}</td>
      <td>${hlPct}%</td>
    </tr>`;
  }).join('');

  // Destroy old GK individual charts
  activeCharts.filter(c=>c._gkInd).forEach(c=>{try{c.destroy();}catch(e){}}); 
  activeCharts=activeCharts.filter(c=>!c._gkInd);

  cont.innerHTML=`
    <div class="athlete-hero">
      <div style="flex:1;min-width:200px">
        <div class="hero-name">#${a.jersey} ${a.name}</div>
        <div class="hero-meta">Goalkeeper · ${sessions.length} sessions tracked</div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hs-val">${lat.DiveCount}</div><div class="hs-lbl">Latest Dives</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:#E41C38">${lat.DiveHighLoad}</div><div class="hs-lbl">High Load</div></div>
        <div class="hero-stat"><div class="hs-val">${lat.DiveLoad.toFixed(0)}</div><div class="hs-lbl">Dive Load</div></div>
        <div class="hero-stat"><div class="hs-val">${lat.PL.toFixed(1)}</div><div class="hs-lbl">Player Load</div></div>
        <div class="hero-stat"><div class="hs-val">${avgDives}</div><div class="hs-lbl">Avg Dives</div></div>
        <div class="hero-stat"><div class="hs-val" style="color:#E41C38">${hlRatio}</div><div class="hs-lbl">HL Ratio</div></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="chart-container">
        <div class="chart-title">Dives + High Load Dives — Per Session</div>
        <canvas id="gkDiveChart"></canvas>
      </div>
      <div class="chart-container">
        <div class="chart-title">Dive Load vs Player Load — Per Session</div>
        <canvas id="gkLoadChart"></canvas>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px">
      <div class="chart-container">
        <div class="chart-title">Weekly Dive Direction Breakdown</div>
        <canvas id="gkWeeklyDir"></canvas>
      </div>
      <div class="chart-container" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="chart-title" style="text-align:center">Season Direction Split</div>
        <canvas id="gkDonut" style="max-height:200px;max-width:200px"></canvas>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mid)">
          <span><span style="color:#5B7FD4">⬤</span> Left ${totL}</span>
          <span><span style="color:#27AE60">⬤</span> Centre ${totC}</span>
          <span><span style="color:#F5A623">⬤</span> Right ${totR}</span>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <div style="overflow-x:auto">
        <table class="session-table">
          <thead><tr>
            <th>Date</th><th>MD</th><th>Env</th><th>PL</th>
            <th>Dives</th><th>High Load</th><th>Dive Load</th>
            <th>Left</th><th>Centre</th><th>Right</th><th>HL%</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;

  setTimeout(()=>{
    const c1=new Chart(document.getElementById('gkDiveChart'),{
      type:'bar',
      data:{
        labels:sLabels,
        datasets:[
          {label:'Total Dives',data:sDives,backgroundColor:'rgba(91,127,212,0.6)',borderColor:'#5B7FD4',borderWidth:1},
          {label:'High Load Dives',data:sHL,backgroundColor:'rgba(228,28,56,0.7)',borderColor:'#E41C38',borderWidth:1},
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'top'}},
        scales:{x:{ticks:{font:{size:10},maxRotation:45}},y:{min:0,grid:{color:'#F0F0F0'}}}}
    });
    c1._gkInd=true; activeCharts.push(c1);

    // Dual axis: Dive Load (bar) + PL (line)
    const c2=new Chart(document.getElementById('gkLoadChart'),{
      type:'bar',
      data:{
        labels:sLabels,
        datasets:[
          {label:'Dive Load',data:sDiveLoad,backgroundColor:'rgba(155,89,182,0.6)',borderColor:'#9B59B6',borderWidth:1,yAxisID:'y'},
          {label:'Player Load',data:sPL,type:'line',borderColor:'#E41C38',borderWidth:2.5,pointRadius:3,fill:false,yAxisID:'y2'},
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'top'}},
        scales:{
          x:{ticks:{font:{size:10},maxRotation:45}},
          y:{title:{display:true,text:'Dive Load'},grid:{color:'#F0F0F0'}},
          y2:{position:'right',title:{display:true,text:'Player Load'},grid:{display:false}}
        }}
    });
    c2._gkInd=true; activeCharts.push(c2);

    // Weekly direction stacked bar
    const c3=new Chart(document.getElementById('gkWeeklyDir'),{
      type:'bar',
      data:{
        labels:wLabels,
        datasets:[
          {label:'Left',  data:weeks.map(w=>weekMap[w].L),backgroundColor:'#5B7FD4',stack:'s'},
          {label:'Centre',data:weeks.map(w=>weekMap[w].C),backgroundColor:'#27AE60',stack:'s'},
          {label:'Right', data:weeks.map(w=>weekMap[w].R),backgroundColor:'#F5A623',stack:'s'},
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'top'}},
        scales:{x:{stacked:true,ticks:{font:{size:11}}},y:{stacked:true,grid:{color:'#F0F0F0'}}}}
    });
    c3._gkInd=true; activeCharts.push(c3);

    // Season donut
    const c4=new Chart(document.getElementById('gkDonut'),{
      type:'doughnut',
      data:{
        labels:['Left','Centre','Right'],
        datasets:[{data:[totL,totC,totR],backgroundColor:['#5B7FD4','#27AE60','#F5A623'],borderWidth:2}]
      },
      options:{responsive:true,maintainAspectRatio:true,
        plugins:{legend:{display:false},tooltip:{callbacks:{
          label:ctx=>` ${ctx.label}: ${ctx.raw} (${((ctx.raw/(totL+totC+totR||1))*100).toFixed(0)}%)`
        }}}
      }
    });
    c4._gkInd=true; activeCharts.push(c4);
  },80);
}

// ── REHAB ────────────────────────────────────────────────────────────────────
function renderRehab(){
  const inj=ALL_ATHLETES.filter(a=>a.minGroup==='I');
  let h=pastBanner();
  if(!inj.length){h+=`<div class="no-flags-msg"><div class="nf-icon">💪</div>No athletes currently in rehab or limited.</div>`;document.getElementById('tab-rehab').innerHTML=h;return;}
  h+=inj.map(a=>{
    const ss=a.sessions.filter(s=>s.date<=SELECTED_DATE);
    const lat=ss.length?ss[ss.length-1]:null;
    return`<div class="rehab-card">
      <div><div style="font-size:16px;font-weight:700">#${a.jersey} ${a.name}</div><div style="font-size:12px;color:var(--mid)">${a.position}</div></div>
      <span class="rehab-badge">REHAB / LIMITED</span>
      ${lat?`<div style="font-size:13px;color:var(--mid)">Last session: ${lat.dateLabel} · PL: ${lat.PL.toFixed(1)} · Duration: ${lat.durationMin.toFixed(0)} min</div>`:'<div style="font-size:13px;color:var(--mid)">No GPS data on or before this date</div>'}
    </div>`;
  }).join('');
  document.getElementById('tab-rehab').innerHTML=h;
}

populateDateSelect();
renderTeam();
</script>
